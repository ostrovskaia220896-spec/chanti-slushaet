name: Build Android APK
on:
  push:
    branches: [main, v0.5-integrated, v0.5-buildfix, v0.6-whisper, v0.6-buildfix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android API 35
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chanti-Slushaet-v0.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
