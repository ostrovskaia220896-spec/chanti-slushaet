plugins {
    id 'com.android.application'
}
android {
    namespace 'ru.chanti.slushaet'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.chanti.slushaet.v2'
        minSdk 27
        targetSdk 35
        versionCode 4
        versionName '0.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
